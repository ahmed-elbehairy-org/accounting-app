<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Column Gradients (Accounting Ledgers / Metric Bars) -->
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Investment Growth Arrow Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Golden Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Coin Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="390" cy="130" r="140" fill="url(#sunGlow)" />

  <!-- ACCOUNTING ELEMENTS: Ascending Ledger Bars with Ledger Lines -->
  <g id="accounting-bars">
    <!-- Bar 1 (Left / Initial Capital) -->
    <rect x="96" y="270" width="68" height="150" rx="18" fill="url(#bar1)" />
    <!-- Accounting ledger row lines -->
    <line x1="110" y1="310" x2="150" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="340" x2="150" y2="340" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="370" x2="150" y2="370" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />

    <!-- Bar 2 (Middle / Operations & Turnover) -->
    <rect x="188" y="200" width="68" height="220" rx="18" fill="url(#bar2)" />
    <!-- Accounting ledger row lines -->
    <line x1="202" y1="240" x2="242" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="270" x2="242" y2="270" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="300" x2="242" y2="300" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="330" x2="242" y2="330" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="360" x2="242" y2="360" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />

    <!-- Bar 3 (Right / Profits & Portfolio Growth) -->
    <rect x="280" y="130" width="68" height="290" rx="18" fill="url(#bar3)" />
    <!-- Accounting ledger row lines -->
    <line x1="294" y1="170" x2="334" y2="170" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="200" x2="334" y2="200" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="230" x2="334" y2="230" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="260" x2="334" y2="260" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="290" x2="334" y2="290" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="320" x2="334" y2="320" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
    <line x1="294" y1="350" x2="334" y2="350" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Base Grid / Financial Horizon Axis -->
  <line x1="80" y1="422" x2="380" y2="422" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- INVESTMENT ELEMENT 1: Dynamic Growth Trajectory Curve -->
  <path d="M 80 370 C 140 365, 175 325, 230 250 C 275 190, 320 145, 385 105" 
        fill="none" 
        stroke="url(#growthGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- INVESTMENT ELEMENT 2: Modern Arrowhead -->
  <path d="M 335 95 L 405 90 L 400 160 L 375 135 L 340 170 L 320 150 L 355 115 Z" 
        fill="url(#growthGrad)" 
        filter="url(#glow)" />

  <!-- INVESTMENT ELEMENT 3: Golden Yield Coin (Return on Investment) -->
  <g transform="translate(390, 85)" filter="url(#glow)">
    <!-- Outer coin ring -->
    <circle cx="28" cy="28" r="34" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="3" />
    <!-- Inner coin rim -->
    <circle cx="28" cy="28" r="26" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4 2" />
    <!-- Growth spark / Mudharaba yield icon inside coin -->
    <path d="M 28 14 L 32 24 L 42 28 L 32 32 L 28 42 L 24 32 L 14 28 L 24 24 Z" fill="#ffffff" />
  </g>
</svg>